  <rect x="796" y="408" width="44" height="44" rx="10" fill="#4285f4"/>
  <text x="818" y="435" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="900" fill="white" text-anchor="middle">GCP</text>
