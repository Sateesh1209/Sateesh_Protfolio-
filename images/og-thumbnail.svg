<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060c1b"/>
      <stop offset="100%" style="stop-color:#0e1a30"/>
    </linearGradient>
    <!-- Cyan-purple gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Particle dots pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#00d4ff" opacity="0.12"/>
    </pattern>
    <!-- Clip path for rounded rect -->
    <clipPath id="card-clip">
      <rect x="0" y="0" width="1200" height="628" rx="0"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Dot grid overlay -->
  <rect width="1200" height="628" fill="url(#dots)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="280" rx="320" ry="240" fill="#00d4ff" opacity="0.055"/>
  <ellipse cx="1050" cy="360" rx="280" ry="220" fill="#8b5cf6" opacity="0.07"/>

  <!-- Left accent bar -->
  <rect x="72" y="80" width="4" height="468" rx="2" fill="url(#grad)" opacity="0.6"/>

  <!-- Top-right corner decoration lines -->
  <line x1="950" y1="0" x2="1200" y2="250" stroke="#00d4ff" stroke-width="0.5" opacity="0.12"/>
  <line x1="1050" y1="0" x2="1200" y2="150" stroke="#8b5cf6" stroke-width="0.5" opacity="0.1"/>
  <line x1="1100" y1="0" x2="1200" y2="100" stroke="#00d4ff" stroke-width="0.5" opacity="0.08"/>

  <!-- Bottom-left decoration -->
  <line x1="0" y1="480" x2="200" y2="628" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="0" y1="530" x2="150" y2="628" stroke="#8b5cf6" stroke-width="0.5" opacity="0.08"/>

  <!-- AVAILABLE badge -->
  <rect x="104" y="80" width="220" height="34" rx="17" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="124" cy="97" r="5" fill="#10b981"/>
  <text x="137" y="102" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#00d4ff" letter-spacing="1.5">OPEN TO WORK</text>

  <!-- Name -->
  <text x="104" y="185" font-family="'Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="white" filter="url(#glow-sm)">Sateesh Kumar</text>
  <!-- Gradient "Nunna" text via two overlapping texts -->
  <text x="104" y="258" font-family="'Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#grad)" filter="url(#glow)">Nunna</text>

